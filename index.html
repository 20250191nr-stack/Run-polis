        function createBuildingTexture(styleIndex) {
            const c = document.createElement('canvas');
            c.width = 512;
            c.height = 512;
            const ctx = c.getContext('2d');

            if (styleIndex === 0) {
                // 写真左側：ティールブルーの反射ガラス・カーテンウォール＆水平アルミマリオン
                const skyGrad = ctx.createLinearGradient(0, 0, 512, 512);
                skyGrad.addColorStop(0, '#0f2942');
                skyGrad.addColorStop(0.5, '#164e63');
                skyGrad.addColorStop(1, '#1e3a8a');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, 512, 512);

                const cols = 10, rows = 14;
                const cellW = 512 / cols, cellH = 512 / rows;
                for (let r = 0; r < rows; r++) {
                    for (let cl = 0; cl < cols; cl++) {
                        const warmReflect = (r + cl) % 5 === 0 || Math.random() > 0.65;
                        ctx.fillStyle = warmReflect ? 'rgba(251, 191, 36, 0.38)' : 'rgba(56, 189, 248, 0.28)';
                        ctx.fillRect(cl * cellW + 3, r * cellH + 5, cellW - 6, cellH - 8);
                    }
                    // 白銀の水平スパンドレル帯
                    ctx.fillStyle = '#94a3b8';
                    ctx.fillRect(0, r * cellH, 512, 5);
                }
                for (let cl = 0; cl <= cols; cl++) {
                    ctx.fillStyle = '#0f172a';
                    ctx.fillRect(cl * cellW - 1.5, 0, 3, 512);
                }
            } else if (styleIndex === 1) {
                // 写真右側：ブロンズ＆ゴールド縦ルーバー・ガラスビル（太陽光反射）
                const bronzeGrad = ctx.createLinearGradient(0, 0, 512, 512);
                bronzeGrad.addColorStop(0, '#451a03');
                bronzeGrad.addColorStop(0.5, '#78350f');
                bronzeGrad.addColorStop(1, '#1c1917');
                ctx.fillStyle = bronzeGrad;
                ctx.fillRect(0, 0, 512, 512);

                const cols = 16, rows = 14;
                const cellW = 512 / cols, cellH = 512 / rows;
                for (let r = 0; r < rows; r++) {
                    ctx.fillStyle = '#292524';
                    ctx.fillRect(0, r * cellH, 512, 6);
                    for (let cl = 0; cl < cols; cl++) {
                        const goldLit = Math.random() > 0.35;
                        ctx.fillStyle = goldLit ? '#f59e0b' : '#27272a';
                        ctx.fillRect(cl * cellW + 3, r * cellH + 6, cellW - 6, cellH - 8);
                        // ブロンズの縦マリオン
                        ctx.fillStyle = '#b45309';
                        ctx.fillRect(cl * cellW, 0, 2.5, 512);
                    }
                }
            } else if (styleIndex === 2) {
                // 写真中央＆右奥：ヘルムズリー／ウォルドルフ風の重厚なライムストーン＆テラコッタ石造りビル
                ctx.fillStyle = '#b48a64';
                ctx.fillRect(0, 0, 512, 512);

                const cols = 8, rows = 12;
                const cellW = 512 / cols, cellH = 512 / rows;
                for (let r = 0; r < rows; r++) {
                    // 石造りの水平コーニス（幕板）
                    if (r % 3 === 0) {
                        ctx.fillStyle = '#78553a';
                        ctx.fillRect(0, r * cellH, 512, 7);
                    }
                    for (let cl = 0; cl < cols; cl++) {
                        // 彫りの深い窓枠
                        ctx.fillStyle = '#5c4028';
                        ctx.fillRect(cl * cellW + 10, r * cellH + 8, cellW - 20, cellH - 14);
                        ctx.fillStyle = Math.random() > 0.4 ? '#fde68a' : '#1e293b';
                        ctx.fillRect(cl * cellW + 14, r * cellH + 11, cellW - 28, cellH - 20);
                    }
                }
            } else {
                // 写真中央奥：メットライフビル風の明るいシルバーグレー・モダニズム高層ビル
                ctx.fillStyle = '#64748b';
                ctx.fillRect(0, 0, 512, 512);

                        ctx.fillRect(cl * cellW + 2, r * cellH + 4, cellW - 4, cellH - 6);
                    }
                }
            }

            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function checkWorldCollision(x, z, radius) {
            for (let i = 0; i < buildingColliders.length; i++) {
                const b = buildingColliders[i];
                if (x + radius > b.minX && x - radius < b.maxX && z + radius > b.minZ && z - radius < b.maxZ) {
                    return b;
                }
            }
            for (let i = 0; i < pillarColliders.length; i++) {
                const p = pillarColliders[i];
                const dx = x - p.x, dz = z - p.z;
                if (dx * dx + dz * dz < (radius + p.r) * (radius + p.r)) {
                    return { minX: p.x - p.r, maxX: p.x + p.r, minZ: p.z - p.r, maxZ: p.z + p.r };
                }
            }
            return null;
        }

        // ビルや橋の支柱、ヘルムズリービルの脚柱に対して、めり込みを正確に押し戻す物理衝突解決関数
        function resolveSolidCollisions(entity, radius) {
            let hitAny = false;

            // 1. ビルおよび構造物のAABB押し出し判定
            for (let i = 0; i < buildingColliders.length; i++) {
                const b = buildingColliders[i];
                const closestX = Math.max(b.minX, Math.min(entity.x, b.maxX));
                const closestZ = Math.max(b.minZ, Math.min(entity.z, b.maxZ));
                const dx = entity.x - closestX;
                const dz = entity.z - closestZ;
                const distSq = dx * dx + dz * dz;

                if (distSq < radius * radius) {
                    hitAny = true;
                    if (distSq > 0.0001) {
                        const dist = Math.sqrt(distSq);
                        const overlap = radius - dist;
                        entity.x += (dx / dist) * overlap;
                        entity.z += (dz / dist) * overlap;
                    } else {
                        // 万が一AABB内部に入った場合は最も近い外周面へ即座に押し出す
                        const dLeft = Math.abs(entity.x - b.minX);
                        const dRight = Math.abs(b.maxX - entity.x);
                        const dTop = Math.abs(entity.z - b.minZ);
                        const dBot = Math.abs(b.maxZ - entity.z);
                        const minD = Math.min(dLeft, dRight, dTop, dBot);
                        if (minD === dLeft) entity.x = b.minX - radius;
                        else if (minD === dRight) entity.x = b.maxX + radius;
                        else if (minD === dTop) entity.z = b.minZ - radius;
                        else entity.z = b.maxZ + radius;
                    }
                }
            }

            // 2. 橋の主塔・中央支柱（円柱）の押し出し判定
            for (let i = 0; i < pillarColliders.length; i++) {
                const p = pillarColliders[i];
                const dx = entity.x - p.x;
                const dz = entity.z - p.z;
                const minDist = radius + p.r;
                const distSq = dx * dx + dz * dz;
                if (distSq < minDist * minDist && distSq > 0.0001) {
                    hitAny = true;
                    const dist = Math.sqrt(distSq);
                    const overlap = minDist - dist;
                    entity.x += (dx / dist) * overlap;
                    entity.z += (dz / dist) * overlap;
                }
            }

            return hitAny;
        }

### 主な変更・修正内容
1. **車両サイズを1.5倍に拡大 (`VEHICLE_SCALE: 0.90 → 1.35`)**:
   - すべての車両（プレイヤーのスーパーカー、NYPDパトカー、イエローキャブ）を**1.5倍の大きさ**に拡大し、それに合わせてチェイスカメラ・ガレージカメラの距離と当たり判定半径（`CAR_RADIUS = 6.8`）を調整しました。
2. **車が地面に埋まる問題の修正 (`getGroundHeight` ＆ 橋デッキ高の統一)**:
   - 車体モデル内部でタイヤ底面に地上クリアランス（`+0.25`）を持たせたほか、道路・ガレージ床・橋の上の地面高を計算する `getGroundHeight(x, z)` を導入し、どの場所を走ってもタイヤが路面の上に接地して地面に埋まらないように修正しました。
3. **写真の街並み（パーク・アベニュー＆ヘルムズリー／メットライフ・ビル）の再現と精密な押し出し当たり判定**:
   - **写真のビル群**: 左側の**ティールブルー反射ガラスビル（1階暖色ロビー柱付き）**、右側の**ブロンズ＆ゴールド縦マリオンビル**、**石造りセットバックビル**、そして大通り正面にそびえる**ヘルムズリー・ビル（1階トンネルアーチ付き）＆背後のメットライフ・ビル**を実装しました。
   - **大通りのディテール**: 写真と同じ**中央の緑地分離帯（植栽・街路樹・緑のNYクラシック街灯）**と、交差点の**白い横断歩道（ゼブラストライプ）**を追加しています。
   - **押し出し式（Push-out）当たり判定**: ビル・ランドマーク脚柱・橋の支柱すべてに対して「最近接点からの法線押し出し判定（`resolveSolidCollisions`）」を導入し、角にぶつかってもめり込んだり引っかかったりせず滑らかに跳ね返るよう改善しました。
